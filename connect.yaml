http:
  enabled: true
  address: 0.0.0.0:4195

logger:
  level: INFO
  format: json
  add_timestamp: true

input:
  redpanda:
    seed_brokers:
      - "${REDPANDA_BROKERS}"
    topics:
      - "${INPUT_TOPIC}"
    consumer_group: "${CONSUMER_GROUP}"
    start_offset: earliest

pipeline:
  processors:
    # The redpanda input keeps the raw header slice on this key. The Python
    # plugin cannot serialize that type, so Connect skips the processor and
    # writes the original record.
    - mapping: 'meta __rpcn_kafka_headers = deleted()'
    - ripple_transform: {}

output:
  redpanda:
    seed_brokers:
      - "${REDPANDA_BROKERS}"
    topic: "${OUTPUT_TOPIC}"
    key: '${! meta("kafka_key") }'
    acks: all
