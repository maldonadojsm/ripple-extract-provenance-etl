name: ripple-extract-provenance-etl

services:
  redpanda:
    image: docker.io/redpandadata/redpanda:v26.2.2
    container_name: extract-provenance-redpanda
    hostname: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  topic-init:
    image: docker.io/redpandadata/redpanda:v26.2.2
    container_name: extract-provenance-topic-init
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for attempt in $(seq 1 30); do
          if rpk topic create ripple.etl.input ripple.etl.output --if-not-exists -X brokers=redpanda:9092; then
            rpk topic list -X brokers=redpanda:9092
            exit 0
          fi
          echo "topic create failed (attempt $${attempt}); retrying..."
          sleep 2
        done
        echo "unable to create topics after retries" >&2
        exit 1

  ripple-etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: extract-provenance-etl
    depends_on:
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      INPUT_TOPIC: ${INPUT_TOPIC:-ripple.etl.input}
      OUTPUT_TOPIC: ${OUTPUT_TOPIC:-ripple.etl.output}
      CONSUMER_GROUP: ${CONSUMER_GROUP:-ripple-transform-etl-v1}
    ports:
      - "43195:4195"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4195/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  redpanda-console:
    image: docker.io/redpandadata/console:v3.11.0
    container_name: extract-provenance-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
